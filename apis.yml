aid: prologium
name: ProLogium Technology
description: 'ProLogium Technology Co., Ltd. is a Taiwanese energy-innovation company
  founded in 2006 that develops and manufactures next-generation solid-state lithium
  ceramic batteries built around a 100% ceramic separator. It commercialized its first
  solid-state cells in 2013, opened the world''s first giga-level solid-state lithium
  ceramic battery plant in Taoyuan, Taiwan in 2024, and operates a European R&D center
  at Paris-Saclay with a planned gigafactory in Dunkirk, France. Its product lines
  span FLCB, PLCB and LLCB cells plus battery modules and packs, targeting electric
  vehicles, energy storage systems, robotics, and consumer and industrial applications.
  ProLogium is a hardware manufacturer: it publishes no developer portal, no public
  API, and no machine-readable API contract of any kind.'
